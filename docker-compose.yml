services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing-dev-password
      POSTGRES_DB: billing
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://billing:billing-dev-password@db:5432/billing
      JWT_SECRET: docker-dev-secret-change-me-in-production-123456
      MAX_PAYMENT_RETRIES: "3"
      RETRY_DAYS: "1,3,7"
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: